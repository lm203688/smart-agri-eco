# 智慧农业生态 · Demo 站点生产反代配置
# 用途：把公网 80/443 流量转发到本地 8000 端口的 demo_server.py
# 部署位置：/etc/nginx/conf.d/agri-eco.conf（或 sites-enabled）
#
# 前置：在 ECS 上 `docker compose -f deploy/docker-compose.prod.yml up -d`
#       demo_server 监听 127.0.0.1:8000，由本 nginx 对外暴露。

server {
    listen 80;
    server_name agri.your-domain.com;   # 改成你的域名；仅 IP 访问可删此行

    # 上传/接口体大小（反馈提交用）
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 证书续期用（如有）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
