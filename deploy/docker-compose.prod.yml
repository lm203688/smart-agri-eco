# 智慧农业生态 · 公网生产部署（serving 模式）
# 由 deploy/setup_ecs.sh 调用：docker compose -f deploy/docker-compose.prod.yml up -d --build
# 仅用 Python 官方镜像 python:3.11-slim，无需本地 pip 依赖（项目纯标准库实现）。
services:
  agri-eco:
    build:
      context: .
      dockerfile: Dockerfile
    image: agri-eco:1.0
    container_name: agri-eco
    # 覆盖 Dockerfile 默认的 verify_all 命令，改为启动 Demo 服务
    command: ["python", "app/demo_server.py"]
    environment:
      - AGRI_DEMO_HOST=0.0.0.0
      - AGRI_DEMO_PORT=8000
      # 视觉后端：PestAgent 调用 ATEX 多模态网关（密钥来自仓库外的 .env，不进 git）
      # .env 需含 AGRI_VISION_URL / AGRI_VISION_KEY / AGRI_VISION_MODEL
      - AGRI_VISION_URL=${AGRI_VISION_URL:-http://host.docker.internal:8420/v1}
      - AGRI_VISION_KEY=${AGRI_VISION_KEY}
      - AGRI_VISION_MODEL=${AGRI_VISION_MODEL:-gpt-4o}
    # 让容器用 host.docker.internal 访问宿主机的 ATEX(:8420)，走 docker 网桥、不受安全组限制
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cities', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
