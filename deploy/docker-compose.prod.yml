# 智慧农业生态 · 生产部署（ECS / 任意支持 Docker 的 Linux 主机）
# 用法：
#   cd 智慧农业生态
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   # 站点：http://<ECS公网IP>:8000 （配合 deploy/nginx.conf 反代到 80/443）
#
# 注意：demo_server 仅标准库，容器已含全部依赖（python:slim）。

services:
  agri-eco:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agri-eco
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AGRI_DEMO_HOST=0.0.0.0
      - AGRI_DEMO_PORT=8000
    command: python app/demo_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/cities').status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
