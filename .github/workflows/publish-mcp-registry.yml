# 智慧农业生态 · 发布到官方 MCP Registry
#
# 为什么放在 CI 而不是本地跑：
#   `mcp-publisher login github` 是**交互式 device-code 流程**（要人工去
#   https://github.com/login/device 输入一次性代码），在无人值守/自动化环境里
#   无法完成。而 `login github-oidc` **只在 GitHub Actions 内可用**——它用
#   workflow 自带的 OIDC token 换取 Registry JWT，全程无人工介入。
#   因此把发布放在 Actions 里是唯一可自动化的路径。
#
# 为什么由 CI 自己构建并上传产物（而不是要求人工先传）：
#   实踩（2026-10-08）：`server.json` 的 `fileSha256` 必须与 Release 上的
#   asset **逐字节一致**。但产物是 zip，任何源码改动都会改变哈希——于是
#   "本地构建 → 回填 → 提交 → 手工重传资产" 这条链每改一次代码就要走一遍，
#   漏一步就报 `❌ sha256 不一致`（旧资产 99968070 / 新构建 aed3c122）。
#   CI 内部一条龙：构建 → 上传/覆盖 Release asset → 用**同一个**文件回填
#   server.json → 立即发布。三处 sha 来源唯一，结构上不可能不一致。
#
# 前置（只需一次）：
#   在 GitHub 仓库 Settings → Actions → General → Workflow permissions，
#   选择 "Read and write permissions"（上传 Release asset 需要 contents: write）。
#
# 触发：
#   1. 手动：Actions → "Publish to MCP Registry" → Run workflow
#   2. 自动：打 tag `v*` 时自动跑一次（例如 v1.1.0）

name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建/更新 Release 并上传 asset
  id-token: write   # github-oidc 认证必需

jobs:
  publish:
    name: 发布 server.json 到官方 Registry
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 单一事实源：先构建产物，得到本次唯一的 sha256。
      - name: 构建 MCPB
        run: |
          python scripts/build_mcpb.py
          python scripts/build_mcpb.py --check

      # 把本次构建的产物挂到 Release（存在则覆盖），
      # 再用 GitHub API 回读校验，确保 Registry 稍后下载到的就是这一份。
      - name: 上传/覆盖 Release 资产并回读校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, time, urllib.request

          doc = json.load(open("server.json", encoding="utf-8"))
          tag = "v" + doc["version"]
          pkg = doc["packages"][0]
          want = pkg["fileSha256"]
          asset_name = pkg["identifier"].rsplit("/", 1)[-1]
          path = os.path.join("dist", asset_name)

          got = hashlib.sha256(open(path, "rb").read()).hexdigest()
          print(f"本地产物 sha256 : {got}")
          assert got == want, f"回填不一致：server.json={want} 产物={got}"

          # Release 不存在则创建（幂等）；已存在则复用。
          create = subprocess.run(
              ["gh", "release", "create", tag, "--title", tag,
               "--notes", f"自动化发布 {tag}（CI 构建）"],
              capture_output=True, text=True)
          if create.returncode != 0 and "already exists" not in (create.stderr or ""):
              print(create.stdout); print(create.stderr)
              sys.exit("❌ 创建 Release 失败")

          # 覆盖上传（--clobber），避免旧资产残留导致哈希不一致。
          up = subprocess.run(
              ["gh", "release", "upload", tag, path, "--clobber"],
              capture_output=True, text=True)
          if up.returncode != 0:
              print(up.stdout); print(up.stderr)
              sys.exit("❌ 上传 Release 资产失败")
          print(f"已上传 {asset_name} -> {tag}")

          # 回读校验：匿名 URL 可能受 CDN 影响，重试若干次。
          url = pkg["identifier"]
          last = ""
          for i in range(6):
              try:
                  data = urllib.request.urlopen(url, timeout=120).read()
                  got = hashlib.sha256(data).hexdigest()
                  if got == want:
                      print(f"✅ 回读一致：{len(data)} bytes  {got}")
                      sys.exit(0)
                  last = f"远端 {got} != 声明 {want}"
              except Exception as e:
                  last = f"{type(e).__name__}: {e}"
              time.sleep(5)
          sys.exit(f"❌ 回读校验失败（重试 6 次）：{last}")
          PY

      - name: 安装 mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: 校验 server.json（Registry 侧真实校验）
        run: ./mcp-publisher validate

      - name: GitHub OIDC 登录（Actions 内免人工）
        run: ./mcp-publisher login github-oidc

      # 先做"内容漂移"检测：Registry 不允许同版本重复发布，若本次产物的 sha
      # 与 Registry 上已发布的同版本不同，说明改了代码却忘了升版本——
      # 这种情况必须显式失败，否则会被下面的幂等分支静默吞掉（新代码永远发不出去）。
      - name: 检测版本漂移（内容变了但版本号没升）
        run: |
          python - <<'PY'
          import json, sys, urllib.parse, urllib.request

          doc = json.load(open("server.json", encoding="utf-8"))
          name, ver = doc["name"], doc["version"]
          want = doc["packages"][0]["fileSha256"]

          url = ("https://registry.modelcontextprotocol.io/v0.1/servers?search="
                 + urllib.parse.quote(name))
          try:
              data = json.load(urllib.request.urlopen(url, timeout=60))
          except Exception as e:
              print("ℹ️ 查询 Registry 失败（%s），跳过漂移检测" % e)
              sys.exit(0)

          for s in data.get("servers", []):
              sd = s.get("server", s)
              if sd.get("name") != name:
                  continue
              for p in sd.get("packages", []):
                  if p.get("registryType") != "mcpb":
                      continue
                  if str(sd.get("version")) != str(ver):
                      continue
                  got = p.get("fileSha256")
                  if got == want:
                      print("✅ 版本 %s 已在架且产物一致（%s）" % (ver, got[:12]))
                      sys.exit(0)
                  sys.exit(
                      "❌ 版本漂移：Registry 上 %s 的产物为 %s，本次构建为 %s。\n"
                      "   同版本不可重复发布，请先升 scripts/build_mcpb.py 的 VERSION\n"
                      "   并同步 CHANGELOG，再重新发布。" % (ver, got[:12], want[:12]))
          print("ℹ️ Registry 上尚无 %s %s，将首次发布" % (name, ver))
          PY

      # 幂等：Registry 不允许同版本重复发布（400 "cannot publish duplicate
      # version"）。首次发布成功后，任何重跑（或 tag 未升版本）都会撞这个错——
      # 这不是故障，是"该版本已在架"的证明。区分处理：重复 => 视为成功；
      # 其他错误 => 照常失败，绝不把真问题吞掉。
      - name: 发布
        run: |
          set +e
          ./mcp-publisher publish 2>&1 | tee publish.out
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "✅ 已发布"
            exit 0
          fi
          if grep -q "cannot publish duplicate version" publish.out; then
            echo "ℹ️ 该版本已在 Registry 上（重复发布被拒）——视为成功，不阻塞流程"
            exit 0
          fi
          echo "❌ 发布失败（非重复版本错误，需人工排查）"
          exit "$rc"

      - name: 复核（查 Registry API）
        run: |
          NAME="$(python -c "import json;print(json.load(open('server.json',encoding='utf-8'))['name'])")"
          echo "查询: $NAME"
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d, ensure_ascii=False, indent=2)[:2000])"
