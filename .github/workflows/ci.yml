# 智慧农业生态 · CI
# 触发：push / pull_request 到 main；也可手动 workflow_dispatch。
# 作用：每次改动自动跑单测 + 端到端验证 + 数据自检，防止回归。
#
# 注意：本项目零第三方依赖（纯 Python 标准库），无需 pip install。
# 需要 PAT 含 Workflows:write 才能在 GitHub 上创建/更新本文件。

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "agent/**"
      - "core/**"
      - "engine/**"
      - "data/**"
      - "skills/**"
      - "app/**"
      - "mcp/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "plugin/**"
      - ".well-known/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "deploy/**"
      - "README.md"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 单测 + 端到端验证 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip（本项目无第三方依赖，仅保留以防未来扩展）
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}

      - name: 运行单元测试（Agent 层）
        run: python -m unittest scripts.test_agents -v

      - name: 运行引擎回归（v2 / v3 / v4）
        run: |
          python -m unittest scripts.test_engine_v2 -v
          python -m unittest scripts.test_engine_v3 -v
          python -m unittest scripts.test_engine_v4 -v

      - name: 端到端验证（多城市 pipeline + Trust 证书）
        run: python scripts/verify_all.py

      - name: Trust 层证书签发验证
        run: python -m core.trust_layer

      - name: 反馈闭环示例（隔离运行，不污染工作区数据）
        env:
          AGRI_CROP_DB: ${{ runner.temp }}/crop_adapt_db.json
          AGRI_FEEDBACK_LOG: ${{ runner.temp }}/feedback_log.json
        run: |
          # flywheel 会真实写盘，指向临时文件避免 CI 污染仓库数据
          cp data/crop_adapt_db.json "${{ runner.temp }}/crop_adapt_db.json"
          python -m engine.flywheel

      - name: 数据完整性门禁（防假数据冒充真实数据）
        run: |
          # 曾内联在本文件里，但内联写法把多个 any(... for k in synth) 用 or
          # 串在多行，触发了推导式作用域 bug（NameError: name 'k' is not defined）
          # ——该分支在 long_term_memory.json 为空时从未执行，所以一直没暴露。
          # 已提为独立脚本，作用域无歧义且可单测：scripts/check_data_integrity.py
          python scripts/check_data_integrity.py

      - name: Skill 注册表合法性
        run: |
          python -c "import json,glob,pathlib
          for p in sorted(glob.glob('skills/registry/*.json')):
              json.load(open(p, encoding='utf-8'))
          print('all registry JSON valid')"

      - name: A2A Agent Card 合法性（.well-known/agent.json）
        run: python scripts/check_agent_card.py

      - name: Agent Plugin 与注册表一致性（SKILL.md 不得手改漂移）
        run: python scripts/build_agent_plugin.py --check

      - name: MCPB 分发包可构建 + server.json 校验
        run: |
          python scripts/build_mcpb.py
          python scripts/build_mcpb.py --check

      - name: 数据自检（JSON 合法性 + 每带作物数）
        run: |
          python -c "import json
          d=json.load(open('data/crop_adapt_db.json', encoding='utf-8'))
          total=sum(len(v['crops']) for v in d['zones'].values())
          print('crops:', total)
          for z,v in d['zones'].items():
              n=len(v['crops']); assert n>=18, f'{z} 只有 {n} 种 (<18)'; print(f'  {z}: {n}')
          print('data OK')"

      - name: MCP server 自测（零依赖 JSON-RPC over stdio）
        run: python scripts/test_mcp_server.py

      - name: Demo 站点端到端冒烟（14 个端点，防哑端点）
        run: |
          # 自动选空闲端口拉起 app/demo_server.py，校验全部 GET/POST 端点
          # 的状态码、体积下限与响应契约键。CI runner 无出网限制问题，
          # 脚本内已显式绕开 HTTP 代理直连回环地址。
          python scripts/check_demo_endpoints.py

      - name: Env Recipe v1 Schema 校验
        run: python scripts/validate_env_recipe.py data/examples/sample_env_recipe.json

      - name: 全量 Env Recipes 校验（data/env_recipes）
        run: python scripts/validate_env_recipe.py data/env_recipes

      - name: 数据质量门禁（防漂移 / 防假数据）
        run: python scripts/data_quality_gate.py

      - name: MCP 命名空间守卫（防 pip mcp 包遮蔽项目 mcp/ 目录）
        run: python scripts/check_mcp_namespace.py

      - name: 全量单测回归（发现 CI 未单独覆盖的模块）
        run: python -S -P -m unittest discover scripts/

      - name: AI 评测基线（P0-H：分区一致率 + 脚手架项）
        run: python scripts/run_eval.py

      - name: 产物汇总
        if: always()
        run: |
          echo "### CI 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 单测 / verify_all / trust_layer / flywheel / 数据自检 全部通过" >> "$GITHUB_STEP_SUMMARY"
