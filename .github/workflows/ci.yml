# 智慧农业生态 · CI
# 触发：push / pull_request 到 main；也可手动 workflow_dispatch。
# 作用：每次改动自动跑单测 + 端到端验证 + 数据自检，防止回归。
#
# 注意：本项目零第三方依赖（纯 Python 标准库），无需 pip install。
# 需要 PAT 含 Workflows:write 才能在 GitHub 上创建/更新本文件。

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "agent/**"
      - "core/**"
      - "engine/**"
      - "data/**"
      - "skills/**"
      - "app/**"
      - "mcp/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "benchmarks/**"
      - "plugin/**"
      - ".well-known/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "deploy/**"
      - "README.md"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 单测 + 端到端验证 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip（本项目无第三方依赖，仅保留以防未来扩展）
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}

      - name: 运行单元测试（Agent 层）
        run: python -m unittest scripts.test_agents -v

      - name: 运行引擎回归（v2 / v3 / v4）
        run: |
          python -m unittest scripts.test_engine_v2 -v
          python -m unittest scripts.test_engine_v3 -v
          python -m unittest scripts.test_engine_v4 -v

      - name: 端到端验证（多城市 pipeline + Trust 证书）
        run: python scripts/verify_all.py

      - name: Trust 层证书签发验证
        run: python -m core.trust_layer

      - name: 反馈闭环示例（隔离运行，不污染工作区数据）
        env:
          AGRI_CROP_DB: ${{ runner.temp }}/crop_adapt_db.json
          AGRI_FEEDBACK_LOG: ${{ runner.temp }}/feedback_log.json
        run: |
          # flywheel 会真实写盘，指向临时文件避免 CI 污染仓库数据
          cp data/crop_adapt_db.json "${{ runner.temp }}/crop_adapt_db.json"
          python -m engine.flywheel

      - name: 数据完整性门禁（防假数据冒充真实数据）
        run: |
          # 曾内联在本文件里，但内联写法把多个 any(... for k in synth) 用 or
          # 串在多行，触发了推导式作用域 bug（NameError: name 'k' is not defined）
          # ——该分支在 long_term_memory.json 为空时从未执行，所以一直没暴露。
          # 已提为独立脚本，作用域无歧义且可单测：scripts/check_data_integrity.py
          python scripts/check_data_integrity.py

      - name: Skill 注册表合法性
        run: |
          python -c "import json,glob,pathlib
          for p in sorted(glob.glob('skills/registry/*.json')):
              json.load(open(p, encoding='utf-8'))
          print('all registry JSON valid')"

      - name: A2A Agent Card 合法性（.well-known/agent.json）
        run: python scripts/check_agent_card.py

      - name: Agent Plugin 与注册表一致性（SKILL.md 不得手改漂移）
        run: python scripts/build_agent_plugin.py --check

      - name: MCPB 分发包可构建 + server.json 校验
        run: |
          python scripts/build_mcpb.py
          python scripts/build_mcpb.py --check

      - name: 数据自检（JSON 合法性 + 每带作物数）
        run: |
          python -c "import json
          d=json.load(open('data/crop_adapt_db.json', encoding='utf-8'))
          total=sum(len(v['crops']) for v in d['zones'].values())
          print('crops:', total)
          for z,v in d['zones'].items():
              n=len(v['crops']); assert n>=18, f'{z} 只有 {n} 种 (<18)'; print(f'  {z}: {n}')
          print('data OK')"

      - name: MCP server 自测（零依赖 JSON-RPC over stdio）
        run: python scripts/test_mcp_server.py

      - name: Demo 站点端到端冒烟（14 个端点，防哑端点）
        run: |
          # 自动选空闲端口拉起 app/demo_server.py，校验全部 GET/POST 端点
          # 的状态码、体积下限与响应契约键。CI runner 无出网限制问题，
          # 脚本内已显式绕开 HTTP 代理直连回环地址。
          python scripts/check_demo_endpoints.py

      - name: Env Recipe v1 Schema 校验
        run: python scripts/validate_env_recipe.py data/examples/sample_env_recipe.json

      - name: 全量 Env Recipes 校验（data/env_recipes）
        run: python scripts/validate_env_recipe.py data/env_recipes

      - name: 数据质量门禁（防漂移 / 防假数据）
        run: python scripts/data_quality_gate.py

      - name: 基础设施工件门禁（原子写 / 占位符 / 许可 / 数据卫生 / 时间戳 / Schema / GIGO）
        run: |
          echo "▶ gate_atomic_write"
          python scripts/gate_atomic_write.py
          echo "▶ gate_no_placeholder"
          python scripts/gate_no_placeholder.py
          echo "▶ gate_license_known"
          python scripts/gate_license_known.py
          echo "▶ gate_data_hygiene"
          python scripts/gate_data_hygiene.py
          echo "▶ gate_no_direct_time"
          python scripts/gate_no_direct_time.py
          echo "▶ gate_tool_schema"
          python scripts/gate_tool_schema.py
          echo "▶ gate_mechanism_gigo"
          python scripts/gate_mechanism_gigo.py
          echo "▶ check_immutable_zone_paths"
          python scripts/check_immutable_zone_paths.py
          echo "✅ 8 门禁全部通过"

      - name: MCP 命名空间守卫（防 pip mcp 包遮蔽项目 mcp/ 目录）
        run: python scripts/check_mcp_namespace.py

      - name: 全量单测回归（发现 CI 未单独覆盖的模块）
        # 只保留 -S（跳过 site-packages）；-P 是 Python 3.11+ 才有的 flag，
        # 而本 workflow 同时跑 3.10 / 3.11 / 3.12，`-P` 会让 3.10 直接
        # exit 2（"Unknown option: -P"）。sys.path 保护改用 PYTHONPATH 隔离。
        run: python -S -m unittest discover scripts/

      - name: AgriRecipeBench（P1 壁垒：Env Recipe 可复现评测基准）
        run: |
          python benchmarks/agri_recipe_bench/run_bench.py --strict
          python -m unittest scripts.test_agri_recipe_bench -v

      - name: Bench 负例回归（S1.2：A/B/C/D 四类共 20 个，全部映射到真实代码路径）
        run: |
          python benchmarks/agri_recipe_bench/run_bench.py --axis negative --summary --strict
          python -m benchmarks.agri_recipe_bench.negative_runner

      - name: Bench 统计纪律（S1.3：多种子重复实验 + 历史分析 → stat_summary.json）
        run: |
          python benchmarks/agri_recipe_bench/run_bench.py --repeats 5 --seed 20241018 --fraction 0.8 --strict
          python benchmarks/agri_recipe_bench/stat_report.py

      - name: M15-B5 评测先行门禁（科学模块 bench 覆盖率）
        run: python scripts/check_bench_coverage.py --gate

      - name: T-3 置信区间（prediction_interval P50+P10-P90）
        run: python -m unittest scripts.test_confidence_intervals -v

      - name: T-1 可信标记（trust_mark + A2A Card 声明）
        run: python -m unittest scripts.test_trust_mark -v

      - name: D-4 A2A Card JWS 签名（HS256，零依赖）
        run: python -m unittest scripts.test_sign_agent_card -v

      - name: S1 不可进化区/可进化区声明守卫（Bounded Self-Evolution）
        run: python -m unittest scripts.test_evolution_zones -v

      - name: A1 Köppen 栅格抽象层（F5：概率分布 + 双后端 + 诚实降级）
        run: python -m unittest scripts.test_climate_grid -v

      - name: S2/E1 多模块不变式棘轮门禁（CI 硬门禁）
        run: python -m benchmarks.ratchet_modules --strict

      - name: S2/E1 evolution benchmark 棘轮（离线内回路飞轮）
        run: |
          python scripts/run_evolution_ratchet.py --check-files
          python scripts/run_evolution_ratchet.py --json

      - name: E4 科学模块 Golden Vectors 回归门禁
        run: python scripts/run_golden_vectors.py --strict

      - name: S1.1 文献 DOI 逐条核对（SCI 投稿前置，防猜测 DOI）
        run: python scripts/validate_references.py --fast

      - name: S1.4 机理内核边界契约 + 作物注册表漂移守卫（SCI 投稿前置）
        run: |
          python scripts/test_mechanism_domain.py
          python scripts/test_crop_registry.py

      - name: S1.5 外部 baseline 对比（Köppen 复算 + 溯源审计，SCI 投稿前置）
        run: python benchmarks/baseline_external/run_baseline.py --strict

      - name: S2-A1 物候一致性交叉验证（7 作物 × 5 温度 + TBASE 边界 + 单调性）
        run: python scripts/s2_a1_phenology_consistency.py --strict

      - name: S2-A2 Köppen 分区一致性（栅格↔分区类集合对账 + 溯源引用链）
        run: python scripts/s2_a2_koppen_consistency.py --strict

      - name: S2-A3 包络稳健性验证（152 配方 × ±10% 温度扰动）
        run: python scripts/s2_a3_envelope_robustness.py --strict

      - name: S2-A4 可复现性证据打包（零依赖审计 + 文件指纹 + 复现命令）
        run: python scripts/s2_a4_reproduction_packaging.py --strict

      - name: S3.1 论文组件生成器（4 表 + 2 图，全部源自 benchmarks/results/*.json）
        run: python scripts/paper_tables.py --strict

      - name: M9-X1 影子执行日志（RSI L1 execution_log 门闭合证据）
        run: |
          python scripts/generate_shadow_execution_log.py --check
          python -m unittest scripts.test_shadow_execution_log -v

      - name: M8-R2 配方 profile 四件套（export/import/diff/clone）
        run: python -m unittest scripts.test_recipe_profile -v

      - name: M5-F1 Split Conformal 保形预测（90% 覆盖率下界）
        run: |
          python agent/conformal.py
          python -m unittest scripts.test_conformal -v

      - name: M10-O2+O4 编排层可审计性（跨 Agent 一致性 + trace 导出）
        run: python -m unittest scripts.test_orchestration_audit -v

      - name: M11-T1 可信标记公共复算 API + AgriTrust Verified 徽章
        run: |
          python scripts/generate_trust_badge.py --svg artifacts/agritrust_badge.svg --doc docs/agritrust_verified.md --quiet
          python scripts/verify_trust_mark.py current --json > /tmp/mark.json
          python scripts/verify_trust_mark.py check-prefix /tmp/mark.json
          python scripts/verify_trust_mark.py from-mark /tmp/mark.json
          python -m unittest scripts.test_verify_trust_mark -v

      - name: W5 治理状态 badge（CI 硬门禁 + SVG 导出）
        run: |
          mkdir -p artifacts
          python scripts/generate_status_badge.py --ci --svg artifacts/status_badge.svg --quiet
          ls -la artifacts/

      - name: AI 评测基线（P0-H：分区一致率 + 脚手架项）
        run: python scripts/run_eval.py

      - name: GAP 审计（advisory，数字漂移早期预警）
        if: always()
        continue-on-error: true
        run: |
          python scripts/gap_audit.py 2>&1 | tee gap_audit.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### GAP 审计报告（advisory）" >> "$GITHUB_STEP_SUMMARY"
          grep -E "→|FAIL|MISS|OK|WARN" gap_audit.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⚠️ 此步骤为 advisory（不阻塞 CI）。数字漂移时请人工复核。" >> "$GITHUB_STEP_SUMMARY"

      - name: 产物汇总
        if: always()
        run: |
          echo "### CI 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 单测 / verify_all / trust_layer / flywheel / 数据自检 全部通过" >> "$GITHUB_STEP_SUMMARY"
