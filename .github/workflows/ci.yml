# 智慧农业生态 · CI
# 触发：push / pull_request 到 main；也可手动 workflow_dispatch。
# 作用：每次改动自动跑单测 + 端到端验证 + 数据自检，防止回归。
#
# 注意：本项目零第三方依赖（纯 Python 标准库），无需 pip install。
# 需要 PAT 含 Workflows:write 才能在 GitHub 上创建/更新本文件。

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "agent/**"
      - "core/**"
      - "engine/**"
      - "data/**"
      - "skills/**"
      - "app/**"
      - "mcp/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "deploy/**"
      - "README.md"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 单测 + 端到端验证 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip（本项目无第三方依赖，仅保留以防未来扩展）
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}

      - name: 运行单元测试（Agent 层）
        run: python -m unittest scripts.test_agents -v

      - name: 运行引擎回归（v2 / v3 / v4）
        run: |
          python -m unittest scripts.test_engine_v2 -v
          python -m unittest scripts.test_engine_v3 -v
          python -m unittest scripts.test_engine_v4 -v

      - name: 端到端验证（多城市 pipeline + Trust 证书）
        run: python scripts/verify_all.py

      - name: Trust 层证书签发验证
        run: python -m core.trust_layer

      - name: 反馈闭环示例（隔离运行，不污染工作区数据）
        env:
          AGRI_CROP_DB: ${{ runner.temp }}/crop_adapt_db.json
          AGRI_FEEDBACK_LOG: ${{ runner.temp }}/feedback_log.json
        run: |
          # flywheel 会真实写盘，指向临时文件避免 CI 污染仓库数据
          cp data/crop_adapt_db.json "${{ runner.temp }}/crop_adapt_db.json"
          python -m engine.flywheel

      - name: 数据完整性门禁（防假数据冒充真实数据）
        run: |
          python - <<'PY'
          import json
          db = json.load(open('data/crop_adapt_db.json', encoding='utf-8'))
          crops = [c for z in db['zones'].values() for c in z.get('crops', [])]
          # 1) calibrated 标记必须有可复算的校准证据
          bad = [c['crop'] for c in crops if c.get('calibrated') and 'measured_calibration' not in c]
          assert not bad, f"{len(bad)} 个作物 calibrated 无证据: {bad[:5]}"
          # 2) 反馈日志不得含 demo/单测/冒烟合成样本
          import os
          log_path = 'data/feedback_log.json'
          if os.path.exists(log_path):
              entries = json.load(open(log_path, encoding='utf-8'))
              synth = {'unittest', 'smoke'}
              bad = [e for e in entries
                     if any(k in (" ".join([str(e.get('note', ''))] + [str(i) for i in e.get('issues', [])])).lower()
                            for k in synth)
                     or '[demo]' in str(e.get('note', ''))]
              assert not bad, f"反馈日志含 {len(bad)} 条合成样本"
          # 3) 长期记忆库不得含合成样本（engine.long_term_memory 在
          #    AGRI_MEMORY_SYNTHETIC 下会给 source_ref 打 [unittest] 标记）
          mem_path = 'data/long_term_memory.json'
          if os.path.exists(mem_path):
              doc = json.load(open(mem_path, encoding='utf-8'))
              mems = doc.get('memories', [])
              bad = [m.get('id') for m in mems
                     if any(k in str(m.get('source_ref', '')).lower()
                            for k in synth)
                     or any(k in str(m.get('skill', '')).lower() for k in synth)
                     or any(k in str(t).lower() for t in m.get('tags', []))]
              assert not bad, f"长期记忆库含 {len(bad)} 条合成样本: {bad[:5]}"
              print(f"  long_term_memory OK ({len(mems)} memories)")
          print(f"data integrity OK ({len(crops)} crops)")
          PY

      - name: Skill 注册表合法性
        run: |
          python -c "import json,glob,pathlib
          for p in sorted(glob.glob('skills/registry/*.json')):
              json.load(open(p, encoding='utf-8'))
          print('all registry JSON valid')"

      - name: 数据自检（JSON 合法性 + 每带作物数）
        run: |
          python -c "import json
          d=json.load(open('data/crop_adapt_db.json', encoding='utf-8'))
          total=sum(len(v['crops']) for v in d['zones'].values())
          print('crops:', total)
          for z,v in d['zones'].items():
              n=len(v['crops']); assert n>=18, f'{z} 只有 {n} 种 (<18)'; print(f'  {z}: {n}')
          print('data OK')"

      - name: MCP server 自测（零依赖 JSON-RPC over stdio）
        run: python scripts/test_mcp_server.py

      - name: Env Recipe v1 Schema 校验
        run: python scripts/validate_env_recipe.py data/examples/sample_env_recipe.json

      - name: 全量 Env Recipes 校验（data/env_recipes）
        run: python scripts/validate_env_recipe.py data/env_recipes

      - name: AI 评测基线（P0-H：分区一致率 + 脚手架项）
        run: python scripts/run_eval.py

      - name: 产物汇总
        if: always()
        run: |
          echo "### CI 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 单测 / verify_all / trust_layer / flywheel / 数据自检 全部通过" >> "$GITHUB_STEP_SUMMARY"
