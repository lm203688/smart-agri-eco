# Smithery 自动发现入口（MCP Registry）
# 提交方式：Smithery 从 GitHub 仓库根目录读取本文件，无需填提交表单。
# 提交后访问 https://smithery.ai/search?q=agri-eco 或 https://smithery.ai/search?q=smart-agri-eco 即可见。
# 校验：文件存在 + 字段完整（本仓库 scripts/check_distribution_readiness.py 已覆盖）。

schemaVersion: 1.0
name: agri-eco
title: 智慧农业生态 Agri-Eco
description: 面向分布式农业的 Agent-native 知识基座：可执行 Env Recipe 环境配方 + 多源气候校准 + WOFOST 物候播期 + 数据血缘溯源。零第三方依赖、可完全离线、可私有化部署；协议版本 MCP 2026-07-28（无状态），兼容 2025-06-18 / 2024-11-05。
homepage: https://github.com/lm203688/smart-agri-eco
documentation: https://github.com/lm203688/smart-agri-eco/blob/main/docs/CORE_OBJECTIVE.md
license: MIT
tags:
  - agriculture
  - agritech
  - environment
  - data
  - science
  - offline-first
  - zero-dependency
repository:
  url: https://github.com/lm203688/smart-agri-eco
  source: github
author:
  name: lm203688
  url: https://github.com/lm203688
version: 1.1.0

# 服务器启动配置（stdio 传输）
startCommand:
  type: stdio
  command: python
  args:
    - mcp/server.py
  environment:
    # 全部可选；不设置时视觉诊断走规则降级、在线数据源不可用时优雅降级
    AGRI_VISION_URL: ""
    AGRI_VISION_KEY: ""
    AGRI_VISION_MODEL: ""
    AGRI_MCP_AUDIT_LOG: ""

# 无需外部参数即可运行
configSchema:
  type: object
  properties: {}
  required: []

# Smithery 抓取元数据
mcpServers:
  agri-eco:
    command: python
    args:
      - mcp/server.py
    transport: stdio
    description: 零依赖 MCP server（标准库 JSON-RPC 2.0 over stdio），暴露 14 个农业工具：分区匹配 / 作物推荐 / 种植计划 / 病虫害诊断 / 养分管理 / Env Recipe 配方 / 物候播期 / 土壤剖面 / BP 投资初筛 / 多源气候调和 / 地理编码→配方 / 数据血缘查询 / 预设城市 / 生态清单。

# 14 个工具摘要（供 Smithery 检索展示）
tools:
  - name: agri_env_recipe
    description: 作物 × 生长阶段 × 设备类别 → Env Recipe v1 合规可执行配方（116 份已发布配方优先命中）
  - name: agri_match_zone
    description: 经纬度 → Köppen-Geiger 气候带 + FAO 农业分区匹配，含温度/降水/土壤/pH/霜冻风险证据链
  - name: agri_recommend_crops
    description: 分区 + 偏好（用途/面积/难度/场景）→ 作物推荐，含适配度评分与兜底品种
  - name: agri_growth_plan
    description: 作物 + 场景 + 分区 → 完整种植计划，含微气候修正（阳台朝向/楼层/遮挡）
  - name: agri_season_advisory
    description: 12 月均温 → 无霜期 + 播期窗口；或作物 + 均温 → 物候天数（WOFOST 积温，7 作物）
  - name: agri_reconcile_climate
    description: 多源气候调和：NASA POWER + Open-Meteo 逐月均值 + 一致度 + 分歧告警
  - name: agri_soil_profile
    description: 土壤剖面（ISRIC SoilGrids 在线优先，降级离线分区均值并明确标注 resolution=zone/confidence=low）
  - name: agri_diagnose_pest
    description: 病虫害与营养缺乏诊断（视觉后端可插拔，未配置走规则降级）
  - name: agri_nutrition_plan
    description: 作物 + 阶段 + 容器容积 → 阶段化施肥方案（NPK 侧重/浓度/频率）
  - name: agri_resolve_recipe
    description: 城市名（中/英）或经纬度 → 分区 → Env Recipe 清单（完全离线）
  - name: agri_query_lineage
    description: 数据血缘溯源：外部 API 参与 + 本地权威文件 SHA256 指纹 + 双源校准实证
  - name: agri_list_cities
    description: 预设城市清单（经纬度 + 气候带，12 城全部已建模）
  - name: agri_list_ecosystem
    description: 开源/商业生态对接清单（integrated/partial/planned/evaluating/competitor/not_evaluated）
  - name: agri_bp_screen
    description: 农业项目投资初筛（六分类 + 五闸爆雷 + 六评分卡 + 一票否决 → 三档结论）

# 边界声明（诚实标注，避免调用方误解）
limitations:
  - 不提供 C 端应用与 B 端 SaaS（见 docs/CORE_OBJECTIVE.md §三）
  - 不承诺 SLA
  - Env Recipe 的 sources[] 含 FAO CC BY-NC-SA 3.0 IGO 来源，整包不得作为付费资产转售
  - 付费标的为服务能力（接入配额 / 优先响应 / 定制建模），非数据本身
