# 智慧农业生态 · 本地部署与验证
# 纯 Python 标准库，无第三方依赖；构建即用
services:
  agri-eco:
    build:
      context: .
      dockerfile: Dockerfile
    image: agri-eco:1.0
    container_name: agri-eco-verify
    # 默认执行端到端验证（健康检查）；可改为 python -m core.trust_layer 单独跑证书
    command: ["python", "scripts/verify_all.py"]
    restart: "no"
